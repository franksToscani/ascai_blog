services:
  - type: web
    name: ascai-blog
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    disk:
      name: uploads
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      # Segreto: impostarlo solo dalla dashboard di Render, mai nel repository
      - key: APP_KEY
        sync: false
      # Dominio principale: le richieste su *.onrender.com vengono reindirizzate qui
      - key: APP_URL
        value: https://ascai-bo.it
      - key: APP_LOCALE
        value: "it"
      - key: APP_NAME
        value: "AS.CA.I Bologna"
      - key: LOG_CHANNEL
        value: "stderr"
      - key: LOG_LEVEL
        value: "info"
      # Database SQLite sul disco persistente (montato su /app/storage): nessun Postgres a pagamento
      - key: DB_CONNECTION
        value: "sqlite"
      - key: DB_DATABASE
        value: "/app/storage/database/database.sqlite"
      - key: SESSION_DRIVER
        value: "database"
      - key: CACHE_STORE
        value: "database"
      - key: QUEUE_CONNECTION
        value: "database"
      - key: FILESYSTEM_DISK
        value: "local"
      - key: MAIL_MAILER
        value: "smtp"
      - key: MAIL_HOST
        value: "smtp.gmail.com"
      - key: MAIL_PORT
        value: "587"
      # Segreti: impostarli dalla dashboard di Render (password per le app di Google)
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: "associazione.camer.bologna@gmail.com"
      - key: MAIL_FROM_NAME
        value: "AS.CA.I Bologna"
    healthCheckPath: /up
