services:
  - type: web
    name: ascai-blog
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://ascai-blog.onrender.com
      - key: DB_CONNECTION
        value: "pgsql"
      - key: DB_HOST
        fromDatabase:
          name: ascai-blog-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ascai-blog-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ascai-blog-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ascai-blog-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ascai-blog-db
          property: password
      - key: DB_SSLMODE
        value: "require"
      - key: SESSION_DRIVER
        value: "database"
      - key: CACHE_STORE
        value: "database"
      - key: QUEUE_CONNECTION
        value: "database"
      - key: FILESYSTEM_DISK
        value: "local"
      - key: MAIL_MAILER
        value: "smtp"
      - key: MAIL_HOST
        value: "smtp.example.com"
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_ENCRYPTION
        value: "tls"
      - key: MAIL_FROM_ADDRESS
        value: "no-reply@example.com"
      - key: MAIL_FROM_NAME
        value: "AscaiBlog"
    healthCheckPath: /

databases:
  - name: ascai-blog-db
